  if(searchPhase==='idle'&&!searchNotice)return '';
  const loading=searchPhase.startsWith('loading_');
  const title=loading?'Loading gene data':searchPhase==='not_found'?'Gene not found':searchPhase==='ambiguous'?'Choose a gene':searchPhase.endsWith('_error')?'Data could not be loaded':'Gene search';
  return `<section class="search-state" role="status" aria-live="polite" aria-busy="${loading}">${loading?'<span class="loading-indicator" aria-hidden="true"></span>':''}<h2>${title}</h2><p>${esc(searchNotice)}</p>${searchPhase==='not_found'?'<p>Search a current mouse gene symbol or an alias. A missing gene does not mean zero expression.</p>':''}${searchPhase.endsWith('_error')?'<button type="button" class="chip" data-search-retry>Retry</button>':''}${searchCandidates.map((c,i)=>`<div style="margin-top:8px">${c.index===null?`<span>${esc(c.symbol)} · ${esc(c.name)} · unavailable in this export</span>`:`<button class="chip" data-candidate="${i}">${esc(c.symbol)} · ${esc(c.name)} · ${esc(c.id)}</button>`}</div>`).join('')}</section>`;
}
function landing(){app.innerHTML=`<div class="shell">${header()}<section class="landing"><div class="landing-inner"><div class="eyebrow">Gene expression atlas</div><h1>Explore the hypothalamus</h1><p>Search for a gene to see where it is expressed.</p><form class="search" id="search" action="navigation-prototype.html" method="get"><input name="gene" aria-label="Search gene" placeholder="Search a gene (e.g. Pomc)" value="${esc(searchQuery)}" autofocus required><button type="submit">Explore gene</button></form><div class="examples">Try <a class="chip" data-gene="Pomc" href="navigation-prototype.html?gene=Pomc">Pomc</a><a class="chip" data-gene="Agrp" href="navigation-prototype.html?gene=Agrp">Agrp</a><a class="chip" data-gene="Npy" href="navigation-prototype.html?gene=Npy">Npy</a></div>${searchFeedback()}</div></section></div>`}
async function initialiseIndex(){
  const request=++searchRequest;searchPhase='loading_index';searchNotice='Loading gene index…';render();
  try{await getExport();if(request!==searchRequest)return;searchPhase='idle';searchNotice=''}
  catch(error){if(request!==searchRequest)return;searchPhase='index_error';searchNotice='Could not load the gene index. Check your connection and try again.';console.error(error)}
  render();
}
function retrySearch(){return searchQuery?openGene(searchQuery):initialiseIndex()}
function meanPresentation(row){
  const value=row.meanWhenDetected===null&&row.percentExpressing!==null&&row.positive===0?'Not detected':numberOrUnavailable(row.meanWhenDetected);
  return `<div class="metric-value">${value}</div>${value==='Not detected'?'<p class="state-detail">Mean expression is undefined because no cells detect this gene.</p>':''}`;
}
function scopeState(){const scope=scopeMetrics();const unsupported=datasetRowsFor().filter(row=>!Array.isArray(row.mapping));return `${scope.percentExpressing===null?'<section class="state-banner" role="status"><h2>Expression unavailable</h2><p>No supported cells are available for this gene. Missing or ambiguous mappings are not zero expression.</p></section>':scope.positive===0?`<section class="state-banner" role="status"><h2>No expression detected</h2><p>${esc(gene)} has zero raw-count-positive cells among ${fmt(scope.eligible)} eligible cells in ${scope.supportedDatasets} supported datasets. Detection is 0%; mean expression and conditional co-detection are undefined.</p></section>`:''}${unsupported.length?`<section class="state-banner"><h2>Some datasets are unavailable</h2>${unsupported.map(row=>`<p>${esc(row.label)}: ${row.state==='gene_not_found'?'gene not found in this dataset':'multiple native gene rows map to this gene'}. Excluded from pooled metrics.</p>`).join('')}</section>`:''}`}
function map(){const nodes=[{a:'PVN',x:436,y:188,rx:50,ry:25,r:-14},{a:'ZI',x:524,y:174,rx:38,ry:21,r:-18},{a:'LHA',x:550,y:278,rx:54,ry:68,r:6},{a:'DMH',x:450,y:252,rx:32,ry:48,r:0},{a:'VMH',x:448,y:346,rx:41,ry:39,r:0},{a:'PVp',x:406,y:302,rx:10,ry:92,r:0}];const spatial=Object.fromEntries(Object.entries(spatialContexts).map(([key,context])=>[key,scopeMetrics(context)]));const maxMean=Math.max(0,...Object.values(spatial).map(row=>row.meanWhenDetected??0));const regionFill=key=>spatial[key].percentExpressing===null?'#d6dce1':spatial[key].positive===0?'#f0f3f5':`rgba(38,105,151,${(.14+.74*(spatial[key].meanWhenDetected/maxMean)).toFixed(2)})`;const regionTitle=key=>`${key} · ${spatialContexts[key]} · ${spatial[key].percentExpressing===null?'Unavailable: no supported eligible cells':`${spatial[key].percentExpressing.toFixed(1)}% expressing · ${spatial[key].positive===0?'Not detected; mean undefined':`mean ${spatial[key].meanWhenDetected.toFixed(2)}`} · ${fmt(spatial[key].positive)} / ${fmt(spatial[key].eligible)} cells`}`;const ellipses=nodes.map(n=>{const mirror=760-n.x;const fill=regionFill(n.a);return `<g><title>${esc(regionTitle(n.a))}</title><ellipse class="nucleus" cx="${n.x}" cy="${n.y}" rx="${n.rx}" ry="${n.ry}" transform="rotate(${n.r} ${n.x} ${n.y})" fill="${fill}"/><ellipse class="nucleus" cx="${mirror}" cy="${n.y}" rx="${n.rx}" ry="${n.ry}" transform="rotate(${-n.r} ${mirror} ${n.y})" fill="${fill}"/><text class="map-label" style="fill:${spatial[n.a].positive===0||spatial[n.a].percentExpressing===null?'#526575':'#f8fbfd'}" x="${n.x}" y="${n.y+4}">${n.a}</text><text class="map-label" style="fill:${spatial[n.a].positive===0||spatial[n.a].percentExpressing===null?'#526575':'#f8fbfd'}" x="${mirror}" y="${n.y+4}">${n.a}</text></g>`}).join('');return `<svg class="brain" viewBox="0 0 760 600" role="img" aria-label="Coronal hypothalamus schematic with expression intensity highlighted by nucleus"><defs><linearGradient id="tissue" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f7f5f1"/><stop offset="1" stop-color="#e9e5df"/></linearGradient><radialGradient id="halo"><stop stop-color="#d7e8f2" stop-opacity=".72"/><stop offset="1" stop-color="#d7e8f2" stop-opacity="0"/></radialGradient></defs><path class="brain-outline" d="M380,96 C305,92 230,98 180,124 C130,150 112,208 120,262 C127,326 156,382 205,416 C224,430 244,433 258,428 C250,440 256,452 270,452 C286,452 296,438 312,444 C334,453 352,464 380,466 C408,464 426,453 448,444 C464,438 474,452 490,452 C504,452 510,440 502,428 C516,433 536,430 555,416 C604,382 633,326 640,262 C648,208 630,150 580,124 C530,98 455,92 380,96 Z" fill="url(#tissue)"/><ellipse cx="380" cy="300" rx="215" ry="190" fill="url(#halo)"/><path d="M380 116l9 16-9 16-9-16z" fill="#c7c1b8"/><path d="M380 148v304" stroke="#c7c1b8" stroke-width="2" stroke-linecap="round"/><path d="M360 207c8-11 16-11 20 0 4-11 12-11 20 0" fill="none" stroke="#d4cec6" stroke-width="1.5"/>${ellipses}<path class="arc-highlight" style="fill:${regionFill('ARC')}" d="M380 430c34 11 40 66 0 80-40-14-34-69 0-80z"><title>${esc(regionTitle('ARC'))}</title></path><text class="map-label arc-label" style="fill:${spatial.ARC.positive===0||spatial.ARC.percentExpressing===null?'#526575':'#f8fbfd'}" x="380" y="466">ARC</text><circle cx="380" cy="452" r="3.5" fill="#716a61"/><ellipse cx="380" cy="522" rx="30" ry="14" fill="#f1ede8" stroke="#cfc7be" stroke-width="1.2"/><text class="me-label" x="380" y="526">ME (unavailable)</text></svg>`}
function expressingDonut({positive,total,percent,color='#4e87aa',small=false}){const pct=Math.max(0,Math.min(100,Number(percent)||0));return `<div class="expressing-donut${small?' small':''}" style="background:conic-gradient(${color} 0 ${pct}%,#e4ebef ${pct}% 100%)"><div class="expressing-donut-center">${fmt(positive)}<small>of ${fmt(total)}</small></div></div>`}
function expressingLegend(percent){const pct=Number(percent)||0;return `<div class="expressing-legend"><div class="expressing-legend-row"><i></i><span>Expressing</span><b>${pct.toFixed(1)}%</b></div><div class="expressing-legend-row negative"><i></i><span>Not expressing</span><b>${(100-pct).toFixed(1)}%</b></div></div>`}
function formulaHelp(id,kind){if(kind==='coexpression')return `<span class="metric-explainer"><button type="button" class="help" data-help="${id}" aria-expanded="${openMetricHelp===id}" aria-label="Explain co-expression metrics">?</button>${openMetricHelp===id?`<aside class="formula-popover" role="dialog" aria-label="Co-expression metrics"><button type="button" class="formula-close" data-help-close aria-label="Close formula">×</button><h4>Co-expression metrics</h4><p>Positive means at least one raw count.</p><div class="formula-subtitle">Recommendation score</div><div class="formula-equation"><span class="formula-fraction"><span>Cells detecting both genes</span><span class="rule"></span><span>${esc(gene)}-positive cells</span></span><span class="formula-times">× 100</span></div><div class="formula-subtitle">Quadrant percentage</div><div class="formula-equation"><span class="formula-fraction"><span>Cells in this quadrant</span><span class="rule"></span><span>All eligible cells</span></span><span class="formula-times">× 100</span></div><p>Conditional scores are directional and do not adjust for background detection. Broadly expressed partners can rank highly.</p><p>Whole hypothalamus · cell-pooled across ${esc(recommendationDatasets())}. Query-positive cells: ${recommendationRecord?fmt(recommendationRecord[2]):'unavailable'}.</p><p>C7 population sizes are measured. C7 pair profiles and quadrant compositions are not yet available.</p></aside>`:''}</span>`;const isMean=kind==='mean';const title=isMean?'Mean expression when detected':'Percentage of cells expressing';const formula=isMean?`<div class="formula-equation"><span class="formula-fraction"><span>Σ log-normalized expression in expressing cells</span><span class="rule"></span><span>Number of expressing cells</span></span></div>`:`<div class="formula-equation"><span class="formula-fraction"><span>Cells with raw_count ≥ 1</span><span class="rule"></span><span>All eligible cells</span></span><span class="formula-times">× 100</span></div>`;const detail=isMean?`<div class="formula-subtitle">Per-cell LogNormalize value</div><div class="formula-normalization"><span>ln(1 +</span><span class="formula-fraction"><span>Raw counts</span><span class="rule"></span><span>Total counts in the cell</span></span><span>× 10,000)</span></div><p>Mean expression averages these log-normalized values across cells with at least one raw count for the gene.</p>`:`<p>Expressing cells have at least one raw count for the gene. Eligible cells are all cells included in this view.</p>`;return `<span class="metric-explainer"><button type="button" class="help" data-help="${id}" aria-expanded="${openMetricHelp===id}" aria-label="Explain ${title}">?</button>${openMetricHelp===id?`<aside class="formula-popover" role="dialog" aria-label="${title} formula"><button type="button" class="formula-close" data-help-close aria-label="Close formula">×</button><h4>${title}</h4>${formula}${detail}</aside>`:''}</span>`}
function positionFormulaPopovers(){document.querySelectorAll('.formula-popover').forEach(pop=>{const anchor=pop.parentElement.querySelector('[data-help]');if(!anchor)return;const rect=anchor.getBoundingClientRect();const width=Math.min(390,window.innerWidth-28);pop.style.width=`${width}px`;const left=Math.max(14,Math.min(rect.left,window.innerWidth-width-14));pop.style.left=`${left}px`;const height=pop.getBoundingClientRect().height;const top=rect.bottom+8+height<window.innerHeight-12?rect.bottom+8:Math.max(12,rect.top-height-8);pop.style.top=`${top}px`})}
function geneDescription(){
  const description=GENE_BLURBS[gene];
  if(!description)return '';
  return `<section class="gene-about" aria-label="About ${esc(gene)}"><h2>About this gene</h2><h3>Protein function</h3><p>${esc(description.function)} <a href="https://www.uniprot.org/uniprotkb/${encodeURIComponent(description.uniprot)}/entry" target="_blank" rel="noopener noreferrer">UniProtKB ${esc(description.uniprot)} ↗</a></p></section>`;
}
function result(){const g=scopeMetrics();app.innerHTML=`<div class="shell">${header()}<div class="topline"><div class="gene-title"><h1>${esc(gene)}</h1><span>${esc(selectedIdentity.name)}</span></div></div>${searchNotice?`<p role="status">${esc(searchNotice)}</p>`:''}${geneDescription()}${scopeState()}<section class="layout"><article class="card spatial"><div class="card-head"><h2>Spatial expression</h2><span class="tiny">HypoMap region annotations</span></div><div class="brain-wrap">${map()}</div><div class="map-note"><span>Mean expression when detected · relative to this gene’s highest mapped region</span><span class="scale-label">Lower <i></i><i></i><i></i> Higher</span></div><div class="subhead">Gray: unavailable · unshaded: no detection · ME has no separate exported region.</div></article><aside class="card metrics"><div><h2>Whole hypothalamus</h2><div class="subhead">Cell-pooled · ${g.supportedDatasets} of ${exportData.metadata.datasets.length} datasets supported</div></div><div class="expressing-donut-block"><div class="expressing-head">Cells expressing ${formulaHelp("main-cells","percent")}</div><div class="expressing-layout">${metricPresentation(g)}</div></div><div class="metric"><div class="metric-label">Mean expression when detected ${formulaHelp("main-mean","mean")}</div>${meanPresentation(g)}<div class="metric-foot">ln(1 + counts per 10k)</div></div><div class="breakdown-row"><span class="tiny">Supported datasets only</span><button class="text-button" data-action="breakdown">By dataset breakdown →</button></div></aside></section><details style="margin-top:16px"><summary>Dataset mappings and spatial annotation coverage</summary><div class="subhead">${datasetDisclosure()}<p>All imported cells remain in whole-hypothalamus denominators for supported datasets. Only cells with a matching hypomap_region contribute to a named region.</p></div></details>${recommendationCard()}</div>`}
function datasetChart(title,values,unit,digits,cap,geneSymbol){const notDetected=values.some(v=>v.state==='not_detected');values=values.filter(v=>v.value!==null);if(!values.length)return `<article class="dataset-chart-panel"><h2>${esc(title)}</h2><p>No available dataset values. ${notDetected?'Mean expression is undefined: no cells detect this gene in the supported datasets.':'This gene has no supported eligible cells.'}</p></article>`;const W=540,H=350,L=63,R=24,T=53,B=58,PW=W-L-R,PH=H-T-B;const chartMean=values.reduce((a,v)=>a+v.value,0)/values.length;const chartSem=values.length>1?Math.sqrt(values.reduce((a,v)=>a+(v.value-chartMean)**2,0)/(values.length-1))/Math.sqrt(values.length):0;const maxVal=Math.max(chartMean+chartSem,...values.map(v=>v.value));const padded=Math.min(cap??Infinity,maxVal*1.2||1);const step=cap?Math.max(1,Math.ceil(padded/5/5)*5):Math.max(.1,Math.ceil(padded/5*10)/10);const axisMax=cap?Math.min(cap,Math.ceil(padded/step)*step):Math.ceil(padded/step)*step;const mean=values.reduce((a,v)=>a+v.value,0)/values.length;const sd=values.length>1?Math.sqrt(values.reduce((a,v)=>a+(v.value-mean)**2,0)/(values.length-1)):0;const sem=values.length>1?sd/Math.sqrt(values.length):0;const high=Math.min(cap??Infinity,mean+sem),low=Math.max(0,mean-sem);const y=v=>T+PH-v/axisMax*PH;const ticks=Array.from({length:Math.floor(axisMax/step)+1},(_,i)=>i*step).map(v=>`<line class="chart-gridline" x1="${L}" x2="${L+PW}" y1="${y(v)}" y2="${y(v)}"/><text class="chart-tick" x="${L-9}" y="${y(v)+3.5}" text-anchor="end">${v.toFixed(cap?0:1)}</text>`).join('');const cx=L+PW/2,barW=150;const points=values.map(v=>{const px=cx,py=y(v.value),label=`${v.label} · ${v.value.toFixed(digits)}${unit}`,selected=selectedDatasets.includes(v.id);return `<g tabindex="0" role="button" aria-pressed="${selected}" data-dataset="${esc(v.id)}" class="chart-point-group${selected?' is-selected':''}"><title>${esc(label)}</title>${selected?`<circle class="point-selection-halo" cx="${px}" cy="${py}" r="9.5"/>`:""}<circle class="chart-point" cx="${px}" cy="${py}" r="6.5" fill="${v.color}"/></g>`}).join('');return `<article class="dataset-chart-panel"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)} for ${esc(geneSymbol)}, showing dataset mean, standard error and individual datasets"><text class="chart-title" x="${W/2}" y="22" text-anchor="middle">${esc(geneSymbol)} · ${esc(title)}</text><text class="chart-subtitle" x="${W/2}" y="40" text-anchor="middle">Mean ± SEM</text>${ticks}<line class="chart-axis" x1="${L}" x2="${L}" y1="${T}" y2="${T+PH}"/><line class="chart-axis" x1="${L}" x2="${L+PW}" y1="${T+PH}" y2="${T+PH}"/><text class="chart-axis-title" transform="translate(17 ${T+PH/2}) rotate(-90)" text-anchor="middle">${esc(title)}${unit==='%'?' (%)':''}</text><rect class="chart-mean" x="${cx-barW/2}" y="${y(mean)}" width="${barW}" height="${T+PH-y(mean)}" rx="3"/><line class="chart-sem" x1="${cx}" x2="${cx}" y1="${y(high)}" y2="${y(low)}"/><line class="chart-sem" x1="${cx-17}" x2="${cx+17}" y1="${y(high)}" y2="${y(high)}"/><line class="chart-sem" x1="${cx-17}" x2="${cx+17}" y1="${y(low)}" y2="${y(low)}"/>${points}<text class="chart-tick" x="${cx}" y="${H-31}" text-anchor="middle">Across datasets</text><text class="chart-summary" x="${cx}" y="${H-13}" text-anchor="middle">Mean ${mean.toFixed(digits)} · SEM ${sem.toFixed(digits)}${unit}</text></svg></article>`}
function breakdown(){const ds=datasetRowsFor();const pctValues=ds.map(d=>({...d,value:d.percentExpressing}));const meanValues=ds.map(d=>({...d,value:d.meanWhenDetected}));const detail=selectedDatasets.map(id=>ds.find(d=>d.id===id)).filter(Boolean).map(selected=>`<section class="dataset-detail-card"><div class="dataset-detail-top"><i style="background:${selected.color}"></i><h2>${esc(selected.label)}</h2></div><div class="dataset-detail-content"><div class="dataset-detail-section"><div><h3>Cells expressing ${formulaHelp(`ds-${selected.id}-cells`,"percent")}</h3>${metricPresentation(selected)}</div></div><div class="dataset-detail-section"><div><h3>Mean expression when detected ${formulaHelp(`ds-${selected.id}-mean`,"mean")}</h3>${meanPresentation(selected)}<div class="metric-foot">ln(1 + counts per 10k)</div></div></div></div></section>`).join('');app.innerHTML=`<div class="shell">${header()}<div class="dataset-page-title"><button class="back" data-action="back">← Spatial view</button><h1>${esc(gene)} · By dataset</h1><p>Whole-hypothalamus summaries. Bars give each supported dataset equal weight; error bars show mean ± SEM.</p></div>${scopeState()}<section class="dataset-chart-grid">${datasetChart('% expressing',pctValues,'%',1,100,gene)}${datasetChart('Mean expression when detected',meanValues,'',2,null,gene)}</section><div class="dataset-legend">${ds.map(d=>`<span><i style="background:${d.color}"></i>${esc(d.label)}${d.state==='available'?'':` · ${esc(d.state.replaceAll('_',' '))}`}</span>`).join('')}</div><div class="chart-note">Click a point to add its dataset card below. Click it again to close the card. Unavailable values are excluded; zero-detection datasets contribute to % expressing but have no defined expression mean.</div><div class="dataset-detail-list">${detail}</div></div>`}
function render(){app.setAttribute('aria-busy',String(searchPhase.startsWith('loading_')));page==='landing'?landing():page==='breakdown'?breakdown():result();positionFormulaPopovers()}
app.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.id==='search'){openGene(new FormData(f).get('gene'));}else if(f.id==='pair'){comparePartner(new FormData(f).get('partner'));}});
app.addEventListener('keydown',e=>{const point=e.target.closest('[data-dataset]');if(point&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selectedDatasets=selectedDatasets.includes(point.dataset.dataset)?selectedDatasets.filter(id=>id!==point.dataset.dataset):[...selectedDatasets,point.dataset.dataset];render()}});
app.addEventListener('change',e=>{if(e.target.matches('[data-population-select]'))selectPopulation(e.target.value)});
app.addEventListener('input',e=>{if(e.target.name==='gene')searchQuery=e.target.value;if(e.target.name==='partner')partner=e.target.value});
app.addEventListener('click',e=>{const quadrant=e.target.closest('[data-quadrant]');if(quadrant&&coexpressionPopulation==='whole'){expandedQuadrant=expandedQuadrant===quadrant.dataset.quadrant?null:quadrant.dataset.quadrant;render();return}if(e.target.closest('[data-search-retry]')){retrySearch();return}const candidate=e.target.closest('[data-candidate]');if(candidate){selectGene(searchCandidates[Number(candidate.dataset.candidate)],'');return}const help=e.target.closest('[data-help]');if(help){openMetricHelp=openMetricHelp===help.dataset.help?null:help.dataset.help;render();return}if(e.target.closest('[data-help-close]')){openMetricHelp=null;render();return}const point=e.target.closest('[data-dataset]');if(point){selectedDatasets=selectedDatasets.includes(point.dataset.dataset)?selectedDatasets.filter(id=>id!==point.dataset.dataset):[...selectedDatasets,point.dataset.dataset];render();return}if(e.target.closest('[data-pair-retry]')){loadPair();return}const retry=e.target.closest('[data-recommendations-retry]');if(retry){loadRecommendations();return}const pairCandidate=e.target.closest('[data-pair-candidate]');if(pairCandidate){selectPartner(pairCandidates[Number(pairCandidate.dataset.pairCandidate)]);return}const suggestion=e.target.closest('[data-partner-index]');if(suggestion){selectPartner(exportData.identity(Number(suggestion.dataset.partnerIndex)));return}const g=e.target.closest('[data-gene]');if(g){openGene(g.dataset.gene,e);return}const a=e.target.closest('[data-action]')?.dataset.action;if(a==='breakdown'){page='breakdown';render()}if(a==='back'){page='result';render()}});render();if(requestedGene)openGene(requestedGene);else initialiseIndex();
